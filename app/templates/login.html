{% extends "base.html" %}
{% block title %}Sign in · TrustVault{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('ui.login') }}">
    <label>E-mail <input type="email" name="email" required autocomplete="username" maxlength="254"></label>
    <label>Password <input type="password" name="password" required autocomplete="current-password" maxlength="256"></label>
    <button>Sign in</button>
  </form>
  <p class="muted">Demo accounts are listed in the project README.</p>
</section>
{% endblock %}
